# VS Agent on your own computer: the agent, its PostgreSQL database and Redis.
# Both agent ports are bound to localhost. The public port (3001) reaches the internet
# through an ngrok tunnel; the admin port (3000) never leaves this machine.
# Copy .env.example to .env and fill it in before `docker compose up -d`.
services:
  vs-agent:
    image: veranalabs/vs-agent:${VS_AGENT_VERSION:?set VS_AGENT_VERSION in .env}
    # The published image is built for amd64; arm64 machines (Apple Silicon) run it emulated.
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    environment:
      PUBLIC_API_PORT: "3001"
      ADMIN_API_PORT: "3000"
      POSTGRES_HOST: postgres
      POSTGRES_USER: vsagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_URL: redis://redis:6379
      # Requests from your terminal arrive through the Docker network gateway.
      ADMIN_API_TRUSTED_NETWORKS: 127.0.0.0/8,::1/128,172.16.0.0/12
    volumes:
      - agent-data:/root/.afj
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
    # Lets the agent reach a backend on this computer (EVENTS_WEBHOOK_URL), on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vsagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vsagent
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vsagent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  agent-data:
  postgres-data:
  redis-data:
