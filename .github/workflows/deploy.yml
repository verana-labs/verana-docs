# .github/workflows/deploy.yml

name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches:
      - main  # Trigger deploy when pushing to main

  workflow_dispatch:

permissions:
      contents: read
      pages: write
      id-token: write

# One deployment at a time: a run that starts while another deploys waits for it
# instead of colliding with it or cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'  # Docusaurus >=3.10 requires Node >=20; 22 is active LTS

      - name: Install dependencies
        run: npm ci

      - name: Build Docusaurus site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./build

  # A job of its own: the artifact is complete before deploy-pages looks it up, and
  # "Re-run failed jobs" re-runs only this job against the build's single artifact.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.repository == 'verana-labs/verana-docs'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
